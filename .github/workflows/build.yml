name: Build Cpp Project
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 서브모듈(외부 라이브러리)까지 모두 다운로드합니다.
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Project
        # OpenXLSX 경로를 포함하여 빌드합니다.
        run: msbuild ED9FontConverter/ED9FontConverter.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ED9FontConverter-EXE
          # 빌드 완료 후 EXE 파일이 생성되는 경로입니다.
          path: "**/x64/Release/*.exe"
