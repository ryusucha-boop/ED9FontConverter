name: Build C++ EXE
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        # 하위 폴더 내의 .sln 파일을 지정합니다.
        run: msbuild ED9FontConverter/ED9FontConverter.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ED9FontConverter-Result
          # 빌드 후 생성되는 EXE 파일의 예상 경로입니다.
          path: "**/x64/Release/ED9FontConverter.exe"
