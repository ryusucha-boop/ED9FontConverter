name: Build C++ EXE
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        # C++ 프로젝트는 msbuild를 사용하여 Release 모드, x64 환경으로 빌드합니다.
        run: msbuild ED9FontConverter.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ED9FontConverter-Program
          # 빌드 결과물(EXE)이 생성되는 정확한 경로입니다.
          path: "x64/Release/ED9FontConverter.exe"
